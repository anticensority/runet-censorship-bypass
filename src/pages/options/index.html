<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PAC-конфигуратор</title>
    <link rel="icon" href="/icons/default-128.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--script src="./top.mjs" type="module"></script-->
    <style>
      /*
        Josh's Custom CSS Reset
        https://www.joshwcomeau.com/css/custom-css-reset/
      */
      /* 1. Use a more-intuitive box-sizing model */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      /* 2. Remove default margin */
      * {
        margin: 0;
      }

      /* 3. Enable keyword animations */
      @media (prefers-reduced-motion: no-preference) {
        html {
          interpolate-size: allow-keywords;
        }
      }

      body {
        /* 4. Add accessible line-height */
        line-height: 1.5;
        /* 5. Improve text rendering */
        -webkit-font-smoothing: antialiased;
      }

      /* 6. Improve media defaults */
      img, picture, video, canvas, svg {
        display: block;
        max-width: 100%;
      }

      /* 7. Inherit fonts for form controls */
      input, button, textarea, select {
        font: inherit;
      }

      /* 8. Avoid text overflows */
      p, h1, h2, h3, h4, h5, h6 {
        overflow-wrap: break-word;
      }

      /* 9. Improve line wrapping */
      p {
        text-wrap: pretty;
      }
      h1, h2, h3, h4, h5, h6 {
        text-wrap: balance;
      }

      /*
        10. Create a root stacking context
      */
      #root, #__next {
        isolation: isolate;
      }
      /* Reset ends */

      /*
      :root {
          The initial theme is light but it's quickly inverted to dark.
          Dark theme should be the first theme user sees by default.
          TODO: Ponder more. E.g. valid color (green) must remain the
          same even after invertion. Also a flash/blink of colors
          during invertion must be avoided.
        */
        /*
        background-color: white; /* Not transparent. */
        /*color: black;
        /*
        border: 0 none white;
        outline: 0 none white;*/
        /*color-scheme: light;
        /* COLOR INVERTION *
        filter: invert(0); TODO: temporary disabled.
      }*/
      :root, html, body {
        /*background: url('./gsbg.png') no-repeat;*/
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        outline: none;
        border: 0;
      }
      body {
        --ribbon-color: #0075ff; /* #4169e1;*/
        font-family: Ubuntu, Arial, sans-serif;
        font-size: 80%;
        display: flex;
        flex-direction: column;
      }
      nav {
        display: flex;
        flex-direction: row;
        padding: 0.2em;
      }
      button {
        margin-left: 0.1em;
        padding: 1px 6px 1px 6px;
      }
      output#status {
        flex-grow: 1;
        align-content: center;
        text-align: left;
        padding-left: 0.5em;
      }
      textarea#editor {
        width: 100%;
        height: 100%;
        align-self: stretch;
        resize: none;
        border: 0;
        outline: none;
      }

      a, a:visited {
        /*color: #0000ee;*/
        color: crimson;
        text-decoration: none;
      }
      #donate {
        align-self: center;
        align-content: center;
        margin: 0 5px 0 5px;
      }

      .use-preferred-color-scheme {
        background-color: #9e9eff;/* pink;*/
        color: purple;
      }
      @media (prefers-color-scheme: dark) {
        .use-preferred-color-scheme {
          color-scheme: dark;
        }
        .use-preferred-color-scheme:has(#ifToggle:checked) {
          color-scheme: light;
        }
      }
      @media (prefers-color-scheme: light) {
        .use-preferred-color-scheme {
          color-scheme: light;
        }
        .use-preferred-color-scheme:has(#ifToggle:checked) {
          color-scheme: dark;
        }
      }
    </style>
  </head>
  <body class="use-preferred-color-scheme">
    <nav>
      <button id="readButton">READ</button>
      <button id="saveButton">SAVE</button>
      <button id="clearButton">CLEAR</button>
      <output id="status">Press READ button to read PAC from settings</output>
      <div>
        <input type="checkbox" id="ifToggle" name="ifToggle" hidden/>
        <button><label for="ifToggle">INVERT</label></button>
      </div>
      <div id="donate">
        <a target="_blank" data-localize="__MSG_Donate__"
          href="https://github.com/anticensority/runet-censorship-bypass/wiki/Поддержать"
        >Donate ❤</a>
      </div>
    </nav>
<textarea id="editor">

</textarea>
  </body>
</html>
